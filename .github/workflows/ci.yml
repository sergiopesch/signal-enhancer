name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          SIGNAL_MODE: demo
          NEXT_PUBLIC_SIGNAL_MODE: demo
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          SIGNAL_MODE: demo
          NEXT_PUBLIC_SIGNAL_MODE: demo
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100

  worker:
    name: Worker quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - run: uv lock --directory worker --check
      - run: uv sync --directory worker --extra dev --extra resemble --frozen
      - run: uv pip check --python worker/.venv/bin/python
      - name: Smoke-test model dependency imports
        run: |
          uv run --directory worker python - <<'PY'
          import deepspeed
          import gradio
          import torch
          import torchaudio
          import torchvision
          from resemble_enhance.enhancer import inference
          from torchaudio.functional import resample
          from torchaudio.transforms import MelSpectrogram

          wave = torch.linspace(-0.2, 0.2, 1_600)
          resampled = resample(wave, 16_000, 44_100)
          mel = MelSpectrogram(
              sample_rate=44_100,
              n_fft=512,
              hop_length=128,
              n_mels=32,
          )(resampled)
          assert torch.isfinite(mel).all()
          assert callable(inference.load_enhancer)
          assert callable(inference.enhance)
          print(
              "model dependency smoke passed:",
              gradio.__version__,
              torch.__version__,
              torchaudio.__version__,
              torchvision.__version__,
              deepspeed.__version__,
          )
          PY
      - name: Audit locked worker dependencies
        run: |
          audit_dir="$(mktemp -d)"
          trap 'rm -rf "$audit_dir"' EXIT
          requirements="$audit_dir/locked.txt"
          auditable="$audit_dir/auditable.txt"
          pinned_source='resemble-enhance @ git+https://github.com/resemble-ai/resemble-enhance.git@8e978149bfe8abab3eb77d965d579a111afdb0ff'
          uv export \
            --directory worker \
            --frozen \
            --extra dev \
            --extra resemble \
            --no-emit-project \
            --no-annotate \
            --no-header \
            --output-file "$requirements"
          test "$(grep -Fxc "$pinned_source" "$requirements")" -eq 1
          grep -Fvx "$pinned_source" "$requirements" > "$auditable"
          uvx --from 'pip-audit==2.10.1' pip-audit \
            --requirement "$auditable" \
            --strict \
            --require-hashes \
            --disable-pip \
            --progress-spinner off
      - run: uv run --directory worker ruff check .
      - run: uv run --directory worker mypy
      - run: uv run --directory worker pytest
      - name: Build deterministic worker image
        run: docker build --file worker/Dockerfile --tag signal-enhancer-worker:${GITHUB_SHA} --build-arg SIGNAL_BUILD_REVISION=${GITHUB_SHA} worker
