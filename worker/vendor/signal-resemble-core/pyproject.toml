[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "signal-resemble-core"
version = "0.1.0"
description = "Signal Enhancer's unchanged, pinned Resemble inference source without the demo UI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "celluloid>=0.2.0",
  "deepspeed>=0.12.4",
  "librosa>=0.10.1",
  "matplotlib>=3.8.1",
  "numpy>=1.26.2",
  "omegaconf>=2.3.0",
  "pandas>=2.1.3",
  "ptflops>=0.7.1.2",
  "rich>=13.7.0",
  "scipy>=1.11.4",
  "soundfile>=0.12.1",
  "torch>=2.1.1",
  "torchaudio>=2.1.1",
  "torchvision>=0.16.1",
  "tqdm>=4.66.1",
  "resampy>=0.4.2",
  "tabulate>=0.8.10",
]

[project.scripts]
resemble-enhance = "resemble_enhance.enhancer.__main__:main"

[project.urls]
Upstream = "https://github.com/resemble-ai/resemble-enhance/tree/8e978149bfe8abab3eb77d965d579a111afdb0ff"
Source = "https://github.com/sergiopesch/signal-enhancer"

[tool.hatch.build.targets.wheel]
packages = ["resemble_enhance"]

[tool.hatch.build.targets.wheel.force-include]
"UPSTREAM_PROVENANCE.json" = "resemble_enhance/_signal_upstream.json"
