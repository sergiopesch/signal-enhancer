[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "signal-enhancer-worker"
version = "0.1.0"
description = "Private audio analysis and speech-restoration worker for Signal Enhancer"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "anyio>=4.9,<5",
  "fastapi>=0.141.1,<0.142",
  "httpx>=0.28.1,<0.29",
  "numpy>=1.26.4,<3",
  "pydantic>=2.11.3,<3",
  "uvicorn[standard]>=0.34.2,<0.36",
]

[project.optional-dependencies]
# This exact source revision is deliberate. The model is imported lazily at runtime.
resemble = [
  "deepspeed>=0.19.3,<0.20",
  "gradio>=6.22,<7",
  "librosa>=0.10.2.post1,<0.11",
  "llvmlite>=0.43,<0.44",
  "numba>=0.60,<0.61",
  "omegaconf>=2.3,<2.4",
  "pillow>=12.3,<13",
  "resemble-enhance @ git+https://github.com/resemble-ai/resemble-enhance.git@8e978149bfe8abab3eb77d965d579a111afdb0ff",
  "rich>=13.7,<14",
  "scipy>=1.13.1,<1.15",
  "soundfile>=0.12.1,<0.14",
  "torch>=2.13,<2.14",
  # TorchAudio is maintenance-only; 2.11 is its newest release and its inference APIs are
  # runtime-tested against the Torch 2.13 line above.
  "torchaudio>=2.11,<2.12",
  "torchvision>=0.28,<0.29",
  "tqdm>=4.66,<5",
]
dev = [
  "httpx2>=2.9.1,<3",
  "mypy>=1.15,<2",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.11.7,<0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/signal_enhancer_worker"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "S", "SIM", "ASYNC"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["signal_enhancer_worker"]
